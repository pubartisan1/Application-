name: Build Neo 3 APK
on:
  workflow_dispatch:
  push:
    branches: [ neo-3 ]
    paths:
      - 'android/**'
      - 'neo3/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Néo 3
        uses: actions/checkout@v4
        with:
          ref: neo-3
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy Néo assets
        run: |
          mkdir -p android/app/src/main/assets
          find neo3 -maxdepth 1 -type f -exec cp {} android/app/src/main/assets/ \;
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Neo3-Amelle.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neo3-Amelle-APK
          path: Neo3-Amelle.apk
          retention-days: 30
