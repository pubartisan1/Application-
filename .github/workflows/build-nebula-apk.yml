name: Build NÉBULA APK

on:
  push:
    branches: [ nebula-android-production ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and verify NÉBULA Android source
        run: |
          cat bootstrap_parts/p_* > bootstrap_nebula.py
          echo '32b9543f51ff312f6dc5d26b0169b19ce4ee6c578527c75cd7d85cd10cecf937  bootstrap_nebula.py' | sha256sum -c -
          python bootstrap_nebula.py
          python -m py_compile bootstrap_nebula.py make_media.py
          bash -n make_audio.sh
      - name: Generate bundled cinematics and ambience
        run: |
          python -m pip install --quiet pillow
          ffmpeg -version | head -1
          python make_media.py
          bash make_audio.sh
          test -f app/src/main/assets/media/cinematic_pearl.mp4
          test -f app/src/main/assets/media/cinematic_train.mp4
          test -f app/src/main/assets/media/cinematic_laugh.mp4
          test -f app/src/main/assets/media/cinematic_orbit.mp4
          test -f app/src/main/assets/media/cinematic_archive.mp4
          test -f app/src/main/assets/media/ambient_pearl.m4a
          test -f app/src/main/assets/media/ambient_train.m4a
          test -f app/src/main/assets/media/ambient_laugh.m4a
          test -f app/src/main/assets/media/ambient_orbit.m4a
          test -f app/src/main/assets/media/ambient_archive.m4a
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint and build debug APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verify APK content and archive integrity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/media/cinematic_pearl.mp4'
          unzip -l "$APK" | grep -q 'assets/media/cinematic_archive.mp4'
          unzip -l "$APK" | grep -q 'assets/media/ambient_pearl.m4a'
          unzip -l "$APK" | grep -q 'assets/media/ambient_archive.m4a'
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: NEBULA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
