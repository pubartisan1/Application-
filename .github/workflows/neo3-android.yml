name: Build Neo 3 APK
on:
  workflow_dispatch:
  push:
    branches: [ neo-3 ]
    paths: [ 'android/**', 'neo3/**', '.github/workflows/neo3-android.yml' ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy Néo world into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp neo3/* android/app/src/main/assets/ || true
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Neo3-Amelle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Neo3-Amelle-APK
          path: Neo3-Amelle.apk
          retention-days: 30
